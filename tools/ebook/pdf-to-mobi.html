<title>PDF to MOBI Converter - FilePresto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2563EB;--primary-dark:#1d4ed8;--bg:#0f0f1a;--card:#1a1a2e;--border:#2d2d4e;--text:#e2e8f0;--text-muted:#94a3b8}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
nav{background:#fff;border-bottom:1px solid #E2E8F0;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}.nav-logo{font-size:1.4rem;font-weight:800;color:#2563EB;text-decoration:none}.nav-links{display:flex;gap:24px;align-items:center;font-size:.95rem}.nav-links a{color:#64748B;font-weight:500}.nav-links a.active{color:#DC2626;font-weight:700}.lang-switcher{display:flex;gap:6px;align-items:center;font-size:.85rem;border-left:1px solid #E2E8F0;padding-left:16px;margin-left:8px}.lang-switcher a{color:#64748B;font-weight:600;padding:2px 6px;border-radius:4px}.lang-switcher a.active{background:#DC2626;color:#fff}.btn-pro{background:#2563EB;color:#fff!important;padding:8px 18px;border-radius:8px;font-weight:600;font-size:.9rem}
.nav-brand{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--primary),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:1rem;align-items:center}
.nav-links a{color:var(--text-muted);text-decoration:none;font-size:.9rem;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.lang-switcher{display:flex;gap:.5rem}
.lang-switcher a{padding:.3rem .7rem;border-radius:6px;border:1px solid var(--border);color:var(--text-muted);text-decoration:none;font-size:.8rem;transition:all .2s}
.lang-switcher a:hover,.lang-switcher a.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.hero{background:linear-gradient(135deg,#1a0533 0%,#2d1b69 50%,#1a0533 100%);padding:3rem 2rem;text-align:center;border-bottom:1px solid var(--border);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero h1{font-size:2.5rem;font-weight:800;margin-bottom:1rem;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--text-muted);font-size:1.1rem;max-width:600px;margin:0 auto}
.container{max-width:800px;margin:0 auto;padding:2rem}
.converter-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:2rem}
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:3rem;text-align:center;cursor:pointer;transition:all .3s;position:relative}
.upload-area:hover,.upload-area.dragover{border-color:var(--primary);background:rgba(139,92,246,.05)}
.upload-icon{font-size:3rem;margin-bottom:1rem}
.upload-area h3{font-size:1.2rem;margin-bottom:.5rem}
.upload-area p{color:var(--text-muted);font-size:.9rem}
#fileInput{display:none}
.file-info{margin-top:1rem;padding:.8rem 1rem;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);border-radius:8px;font-size:.9rem;display:none}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.9rem 2rem;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;border:none;transition:all .3s}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;width:100%;justify-content:center;margin-top:1.5rem}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(139,92,246,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-download{background:linear-gradient(135deg,#059669,#047857);color:#fff;width:100%;justify-content:center;margin-top:1rem;display:none}
