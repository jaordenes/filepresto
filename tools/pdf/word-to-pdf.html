<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Security headers -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://unpkg.com; worker-src blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), nfc=()">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word to PDF - FilePresto</title>
<meta name="description" content="Convert Word DOCX documents to PDF. Free, no registration required.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#DC2626;--primary-dark:#B91C1C;--bg:#f8f9fa;--text:#333}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
nav{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.5rem;font-weight:700;color:var(--primary);text-decoration:none}
.nav-links a{margin-left:1rem;text-decoration:none;color:#555;font-size:.9rem}
.nav-links a:hover{color:var(--primary)}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:3rem 2rem;text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero h1{font-size:2.2rem;margin-bottom:.5rem}
.hero p{font-size:1.1rem;opacity:.9}
.container{max-width:800px;margin:2rem auto;padding:0 1rem}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.08);padding:2rem;margin-bottom:1.5rem}
.upload-area{border:2px dashed #ddd;border-radius:8px;padding:3rem 2rem;text-align:center;cursor:pointer;transition:all .3s}
.upload-area:hover,.upload-area.dragover{border-color:var(--primary);background:#fff5f5}
.upload-area input{display:none}
.upload-icon{font-size:3rem;margin-bottom:1rem}
.convert-btn{background:var(--primary);color:#fff;border:none;padding:1rem 2rem;border-radius:8px;font-size:1.1rem;cursor:pointer;width:100%;margin-top:1rem;transition:background .3s}
.convert-btn:hover:not(:disabled){background:var(--primary-dark)}
.convert-btn:disabled{opacity:.5;cursor:not-allowed}
.progress-wrap{margin:1rem 0;display:none}
.progress-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);width:0;transition:width .3s}
.progress-text{text-align:center;margin-top:.5rem;font-size:.9rem;color:#666}
.download-btn{background:#27ae60;color:#fff;border:none;padding:1rem 2rem;border-radius:8px;font-size:1.1rem;cursor:pointer;width:100%;margin-top:1rem;display:none;text-decoration:none;text-align:center;transition:background .3s}
.download-btn:hover{background:#219a52}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.feature{text-align:center;padding:1.5rem}
