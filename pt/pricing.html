*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2563EB;--primary-dark:#1D4ED8;--primary-light:#EFF6FF;--text:#1F2937;--text-light:#6B7280;--bg:#F9FAFB;--white:#FFFFFF;--border:#E5E7EB;--radius:12px;--shadow:0 4px 24px rgba(37,99,235,.08)}

.nav-links a:hover{color:var(--primary)}
.lang-switcher{display:flex;gap:8px;font-size:.85rem}
.lang-switcher a{padding:4px 10px;border-radius:6px;border:1px solid var(--border);color:var(--text-light);transition:.2s}
.lang-switcher a.active,.lang-switcher a:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-pro{background:var(--primary);color:#fff!important;padding:8px 20px;border-radius:8px;font-weight:700;font-size:.9rem;transition:.2s}
